server {
    listen 60088;
    server_name 192.168.127.32;

    root /srv/eido-extension-root;
    autoindex off;

    access_log /var/log/nginx/eido-extension-access.log;
    error_log /var/log/nginx/eido-extension-error.log;

    location = /healthz {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        return 200 '{"status":"ok"}';
    }

    location = /extensions/eido/update.xml {
        types {
            application/xml xml;
        }
        default_type application/xml;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;

        limit_except GET HEAD {
            deny all;
        }
    }

    location ^~ /extensions/eido/releases/ {
        types {
            application/x-chrome-extension crx;
        }
        default_type application/x-chrome-extension;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;

        limit_except GET HEAD {
            deny all;
        }
    }

    location / {
        return 404;
    }
}
