# GitHub 多租户部署；私有配置默认放在 .eido/deploy-mao/runtime.env。
services:
  eido-gateway:
    image: ${EIDO_GATEWAY_IMAGE:-damaohongtu/eido-gateway:latest}
    container_name: eido-gateway
    restart: unless-stopped
    mem_limit: 384m
    oom_score_adj: 150
    ports:
      - "${EIDO_PORT:-80}:80"
    networks:
      - eido-net
    dns:
      - ${EIDO_DNS_1:-223.5.5.5}
      - ${EIDO_DNS_2:-114.114.114.114}
    env_file:
      - ${EIDO_ENV_FILE:-../.eido/deploy-mao/runtime.env}
    environment:
      EIDO_SANDBOX_MODE: docker
      EIDO_TRUST_GATEWAY: "0"
      EIDO_DATA_ROOT: /data
      AUTH_DISABLED: "False"
      EIDO_USER_IMAGE: ${EIDO_USER_IMAGE:-damaohongtu/eido-user:latest}
      EIDO_NET: eido-mao-net
      EIDO_GATEWAY_CONTAINER: eido-gateway
      EIDO_GATEWAY_INTERNAL_URL: http://eido-gateway/ai-eido
      EIDO_GATEWAY_SECRET: ${EIDO_GATEWAY_SECRET:?必须配置网关密钥}
      EIDO_USER_MEM: ${EIDO_USER_MEM:-512m}
      EIDO_USER_CPUS: ${EIDO_USER_CPUS:-0.75}
      EIDO_USER_PIDS_LIMIT: ${EIDO_USER_PIDS_LIMIT:-256}
      EIDO_USER_TMPFS_SIZE: ${EIDO_USER_TMPFS_SIZE:-128m}
      EIDO_SANDBOX_IDLE_TTL: ${EIDO_SANDBOX_IDLE_TTL:-180}
      CLAUDE_DIR: ${CLAUDE_DIR:-/root/.claude}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${CLAUDE_DIR:-/root/.claude}:/workspace/.claude
      - eido-gateway-data:/data
      - ${LOG_DIR:-/root/eido-logs}/gateway:/var/log/eido/app
      - ${LOG_DIR:-/root/eido-logs}/nginx:/var/log/eido/nginx
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1/ai-eido/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  eido-gateway-data:
    name: eido-gateway-data

networks:
  eido-net:
    name: eido-mao-net
    driver: bridge
