# Included inside nginx http {}; map must remain outside server {}.
# Both frontends use /ai-eido/. Only the selected filesystem root changes.
map $http_user_agent $eido_frontend_root {
    default /var/www;
    ~*(android|iphone|ipod|ipad|mobile|windows.phone|blackberry|opera.mini|iemobile|harmonyos) /var/www/h5;
}

server {
    listen 80;
    server_name localhost;

    access_log /var/log/eido/nginx/access.log;
    error_log /var/log/eido/nginx/error.log;

    location /ai-eido/api {
        rewrite ^/ai-eido/api(.*)$ /api$1 break;

        proxy_pass http://127.0.0.1:8000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 安全：strip 客户端伪造的受信网关头，只允许 gateway 进程内部 / docker exec 注入
        proxy_set_header X-Eido-User-Id "";
        proxy_set_header X-Eido-Gateway-Secret "";
        # X-Eido-User-Token is signed and verified by the gateway; tenant task CLIs need it.

        # SSE streaming
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Accel-Buffering no;
        proxy_request_buffering off;

        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        proxy_buffering off;
        proxy_cache off;

        client_max_body_size 25M;
    }

    location /ai-eido/health {
        rewrite ^/ai-eido/health$ /health break;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /ai-eido {
        return 301 /ai-eido/$is_args$args;
    }

    # Pin hashed assets to their build, even if a request's UA changes.
    location ^~ /ai-eido/assets/ {
        root /var/www;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ^~ /ai-eido/mobile-assets/ {
        root /var/www/h5;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Public files must not fall back to HTML when missing.
    location ^~ /ai-eido/images/ {
        root $eido_frontend_root;
        try_files $uri =404;
        add_header Vary "User-Agent" always;
    }

    location /ai-eido/ {
        root $eido_frontend_root;
        index index.html;
        try_files $uri $uri/ /ai-eido/index.html;
        # Proxies/CDNs must vary the HTML response by device.
        add_header Vary "User-Agent" always;
        add_header Cache-Control "no-cache" always;
    }

    location = / {
        return 301 /ai-eido/;
    }
}
