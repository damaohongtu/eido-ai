server {
    listen 80;
    server_name localhost;

    access_log /var/log/eido/nginx/access.log;
    error_log /var/log/eido/nginx/error.log;

    location /ai-eido/api {
        rewrite ^/ai-eido/api(.*)$ /api$1 break;

        proxy_pass http://127.0.0.1:8000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 安全：strip 客户端伪造的受信网关头，只允许 gateway 进程内部 / docker exec 注入
        proxy_set_header X-Eido-User-Id "";
        proxy_set_header X-Eido-Gateway-Secret "";
        proxy_set_header X-Eido-User-Token "";

        # SSE streaming
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Accel-Buffering no;
        proxy_request_buffering off;

        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        proxy_buffering off;
        proxy_cache off;

        client_max_body_size 25M;
    }

    location /ai-eido/health {
        rewrite ^/ai-eido/health$ /health break;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 移动端 H5（独立工程 frontend-mobile，base=/ai-eido/m/）。
    # API 仍复用 /ai-eido/api，故此处仅承载移动端静态资源 + SPA fallback。
    location /ai-eido/m {
        root /var/www;
        index index.html;
        try_files $uri $uri/ /ai-eido/m/index.html;
    }

    location /ai-eido {
        root /var/www;
        index index.html;
        try_files $uri $uri/ /ai-eido/index.html;
    }

    location = / {
        return 301 $scheme://$http_host/ai-eido;
    }
}
