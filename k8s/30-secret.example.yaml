# k8s/30-secret.yaml 样例（占位值，可安全提交）
#
# 正式文件由 gen-secret.sh 从 docker/.env 生成（含真实凭据，已被 .gitignore
# 排除）；也可复制本文件为 30-secret.yaml 后手工填写。
#
# - SESSION_SECRET_KEY / EIDO_GATEWAY_SECRET：各填 `openssl rand -hex 32` 的
#   输出；重新生成会使所有已有会话失效
# - ANTHROPIC_BASE_URL / ANTHROPIC_API_KEY：provider relay 使用的模型凭据，
#   API_KEY 与 AUTH_TOKEN 二选一
# - 用 stringData 免去 base64 编码
apiVersion: v1
kind: Secret
metadata:
  name: eido-secrets
  namespace: eido-system
type: Opaque
stringData:
  SESSION_SECRET_KEY: "change-me-openssl-rand-hex-32"
  EIDO_GATEWAY_SECRET: "change-me-openssl-rand-hex-32"
  ANTHROPIC_BASE_URL: "https://open.bigmodel.cn/api/anthropic"
  ANTHROPIC_API_KEY: "change-me"
  ANTHROPIC_AUTH_TOKEN: ""
