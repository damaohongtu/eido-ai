<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <style>
    body { font: 13px -apple-system, BlinkMacSystemFont, sans-serif; line-height: 1.55; color: #202124; }
    h1 { margin: 0 0 12px; font-size: 22px; }
    ol { padding-left: 22px; }
    li { margin: 7px 0; }
  </style>
</head>
<body>
  <h1>安装完成</h1>
  <p>Eido OpenCode Launcher 已注册到 Google Chrome。</p>
  <ol>
    <li>在 Chrome 扩展管理页重新加载 Eido，或完全退出后重新打开 Chrome。</li>
    <li>打开 Eido 侧边栏，进入“我的设置”，将执行位置切换为“本机”。</li>
    <li>选择项目文件夹，然后点击“尝试唤起 OpenCode”。</li>
  </ol>
</body>
</html>
