<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <style>
    body { font: 13px -apple-system, BlinkMacSystemFont, sans-serif; line-height: 1.55; color: #202124; }
    h1 { margin: 0 0 12px; font-size: 22px; }
    p { margin: 8px 0; }
    .note { margin-top: 16px; padding: 10px 12px; border-left: 3px solid #5f6368; background: #f5f6f7; }
  </style>
</head>
<body>
  <h1>安装 Eido OpenCode Launcher</h1>
  <p>该组件允许 Eido Chrome 插件在您确认后选择项目目录，并尝试启动本机 OpenCode。</p>
  <p>Launcher 仅在 Chrome 发起请求时短暂运行。它不监听网络端口，不代理聊天、网页、附件或项目文件。</p>
  <div class="note">继续安装需要管理员授权。OpenCode 需要单独安装，安装器不会下载或升级 OpenCode。</div>
</body>
</html>
